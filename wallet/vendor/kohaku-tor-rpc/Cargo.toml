# Vendored from https://github.com/ethereum/kohaku-rs, crates/tor-rpc at
# 21e3cd9153c2c920c1301912813d72ea129643bb (the revision reviewed in
# docs/KOHAKU_WALLET_RESEARCH.md). Why vendored: upstream builds the Arti client from
# `TorClientConfig::default()` and keeps `TorRpc`'s fields private, so no wrapper can choose
# Arti's state and cache directories (Android has no home directory for Arti's defaults).
# Local changes (diff against upstream in local-changes.diff):
#   - `TorRpc::connect_with_config`: bootstrap from a caller-built `TorClientConfig`
#   - Alloy behind the default `alloy` feature; hyper, hyper-util and bytes come directly, so
#     `default-features = false` builds without native-tls/OpenSSL (Alloy's `hyper` feature
#     always enables hyper-tls)
#   - workspace keys (license, repository, lints, alloy/anyhow/tokio versions) inlined
#   - `http_limited`: bound response collection while streaming, with a typed size error

[package]
name = "kohaku-tor-rpc"
version = "0.0.1"
edition = "2024"
description = "Alloy JSON-RPC over Arti with shared or session-isolated circuits"
license = "MIT"
repository = "https://github.com/ethereum/kohaku-rs"

[features]
default = ["alloy"]
# Upstream's Alloy surface (`rpc_client`, `provider`, `send`).
alloy = ["dep:alloy"]

[dependencies]
alloy = { version = "2.4.1", optional = true, features = [
    "providers",
    "json-rpc",
    "transport-http",
    "hyper",
] }
anyhow = "1.0.104"
arti-client = { version = "0.32", default-features = false, features = [
    "tokio",
    "rustls",
    "compression",
    "static-sqlite",
] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = [
    "http1",
    "ring",
    "tls12",
    "webpki-roots",
] }
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "ring",
] }
tokio = { version = "1.53.1", features = [
    "io-util",
    "macros",
    "rt-multi-thread",
] }
tor-rtcompat = { version = "0.32", features = ["tokio", "rustls"] }
tower = { version = "0.5" }
url = "2"
